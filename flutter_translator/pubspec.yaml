name: flutter_translator
description: Live Mandarin → English translator (Flutter desktop)
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  whisper_ggml: ^1.3.0
  record: ^5.1.2
  web_socket_channel: ^3.0.0
  path_provider: ^2.1.4
  path: ^1.9.0
  provider: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
